name: Build iOS app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned — SideStore signs it on your phone)
        run: |
          set -o pipefail
          xcodebuild \
            -project CamerApp.xcodeproj \
            -scheme CamerApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CamerApp.app Payload/
          zip -qry CamerApp.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CamerApp-ipa
          path: CamerApp.ipa

      - name: Publish to the "latest" release
        if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CamerApp.ipa \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}" \
            --target "$GITHUB_SHA" \
            --prerelease
