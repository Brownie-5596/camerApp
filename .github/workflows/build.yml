name: Build iOS app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned — SideStore signs it on your phone)
        run: |
          set -o pipefail
          xcodebuild \
            -project CamerApp.xcodeproj \
            -scheme CamerApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            MARKETING_VERSION="0.3.${{ github.run_number }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CamerApp.app Payload/
          zip -qry CamerApp.ipa Payload

      - name: Write SideStore source
        run: |
          cat > source.json <<JSON
          {
            "name": "CamerApp",
            "identifier": "com.brownie.camerapp.source",
            "apps": [
              {
                "name": "CamerApp",
                "bundleIdentifier": "com.brownie.camerapp",
                "developerName": "Brownie-5596",
                "localizedDescription": "Manual camera for aurora, lightning and night sky photography.",
                "iconURL": "https://github.com/Brownie-5596.png",
                "versions": [
                  {
                    "version": "0.3.${{ github.run_number }}",
                    "buildVersion": "${{ github.run_number }}",
                    "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                    "localizedDescription": "Build ${GITHUB_SHA::7}",
                    "downloadURL": "https://github.com/${{ github.repository }}/releases/download/latest/CamerApp.ipa",
                    "size": $(stat -f%z CamerApp.ipa),
                    "minOSVersion": "17.0"
                  }
                ],
                "appPermissions": {
                  "entitlements": [],
                  "privacy": {
                    "NSCameraUsageDescription": "Takes photos.",
                    "NSPhotoLibraryAddUsageDescription": "Saves photos.",
                    "NSLocationWhenInUseUsageDescription": "Records where photos were taken."
                  }
                }
              }
            ],
            "news": []
          }
          JSON
          python3 -m json.tool source.json > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: CamerApp-ipa
          path: CamerApp.ipa

      - name: Publish to the "latest" release
        if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CamerApp.ipa source.json \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}" \
            --target "$GITHUB_SHA" \
            --prerelease
